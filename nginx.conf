server {
    listen 80;
    server_name _;

    # Redirect /malan-timer to /malan-timer/
    location = /malan-timer {
        return 301 /malan-timer/;
    }

    # AI server Proxy
    location /malan-timer/extract {
        client_max_body_size 20M;
        proxy_pass http://192.168.219.104:8000/extract;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Web Server Proxy
    location ~ ^/malan-timer/(timer/image|user) {
        proxy_pass http://192.168.219.101:38081/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
    }
    location /malan-timer/oauth2/ {
        proxy_pass http://192.168.219.101:38081/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /malan-timer/api/ {
        proxy_pass http://192.168.219.101:38081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /malan-timer/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /malan-timer/index.html;

            # index.html은 캐시하지 않음
            location = /malan-timer/index.html {
              add_header Cache-Control "no-cache, no-store, must-revalidate";
              expires 0;
            }

            # 정적 파일만 캐싱
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
              expires 30d;
              add_header Cache-Control "public, no-transform";
            }
    }
} 